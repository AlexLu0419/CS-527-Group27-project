id: pattern_extract
version: 1
role: generate
temperature: 0.3
system: |
  You are analyzing errors made by an automated patch-verification system. Your job is to identify transferable failure patterns — generalizable classes of patches that the system incorrectly accepted or rejected — and propose concrete detection rules that would catch them.
template: |
  Below are {{ labeled_examples | length }} labeled examples where the SIEVE system's verdict disagreed with the ground-truth outcome. Each example has the issue, the patch, the system's verdict, and the correct label.

  --- LABELED EXAMPLES ---
  {% for ex in labeled_examples %}
  === {{ ex.instance_id }} ({{ ex.error_type }}) ===
  System verdict: {{ ex.system_verdict }}   Ground truth: {{ ex.ground_truth }}
  Issue: {{ ex.issue_summary }}
  Patch:
  ```diff
  {{ ex.patch_diff }}
  ```
  {% endfor %}
  --- END EXAMPLES ---

  Group these examples into failure patterns. For each pattern, provide:

  1. `pattern_id`: short snake_case identifier (e.g. symptom_suppression_none_return)
  2. `description`: 1-sentence description of the pattern
  3. `error_type`: "false_accept" (system said PASS, actual FAIL) or "false_reject" (system said FAIL, actual PASS)
  4. `example_instance_ids`: which of the labeled examples exhibit this pattern
  5. `detection_heuristic`: a concrete rule that would detect this pattern. Prefer rules that are one of:
     - a regex on the patch diff
     - a semantic check describable in one line
     - a rubric-item addition that would catch it
  6. `proposed_intervention`: one of ["add_rubric_item", "modify_rubric_item_2_examples", "add_mask_instruction", "modify_feedback_prompt", "add_semgrep_rule"]

  Return a JSON object with a `patterns` array. Only include patterns that cover at least 2 examples. Cap the list at 5 patterns.
output_schema:
  type: object
  required: [patterns]
  properties:
    patterns:
      type: array
      items:
        type: object
        required: [pattern_id, description, error_type, example_instance_ids, detection_heuristic, proposed_intervention]
        properties:
          pattern_id: { type: string }
          description: { type: string }
          error_type: { type: string, enum: [false_accept, false_reject] }
          example_instance_ids:
            type: array
            items: { type: string }
          detection_heuristic: { type: string }
          proposed_intervention:
            type: string
            enum: [add_rubric_item, modify_rubric_item_2_examples, add_mask_instruction, modify_feedback_prompt, add_semgrep_rule]
