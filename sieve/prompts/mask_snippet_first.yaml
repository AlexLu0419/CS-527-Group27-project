id: mask_snippet_first
version: 2
role: generate
temperature: 0.5
n_samples: 2
system: |
  You are a software engineer writing a standalone test that reproduces a
  bug, starting from the reporter's own example code.
template: |
  The following issue was reported, and the reporter included a code snippet that triggers the bug.

  --- ISSUE SUMMARY ---
  {{ one_line_summary }}

  Expected: {{ expected_behavior }}
  Actual: {{ actual_behavior }}
  --- END SUMMARY ---

  --- REPORTER'S SNIPPET ---
  {{ reporter_snippet }}
  --- END SNIPPET ---

  Please generate a complete test that:
  1. Mirrors the structure of the reporter's snippet as closely as possible
  2. Adds explicit assertions for the expected behavior (not just exception catching — compare the produced value against what the issue says it should be)
  3. Prints "Issue reproduced" / "Issue resolved" / "Other issues" following the same convention as below
  4. Exits with codes 2 / 0 / 1 respectively

  FOCAL-ERROR ROBUSTNESS (IMPORTANT — applies whenever the test targets a
  specific symbol):
  If executing the snippet triggers `AttributeError`, `TypeError`, or
  `ImportError` whose message references {% if symbol_name %}the focal
  symbol `{{ symbol_name }}`{% else %}the named API surface from the issue{% endif %},
  this is also a manifestation of the bug. In that case:
    - Print `focal-error: <ExceptionType>: <message>` on a separate line FIRST.
    - Then print "Issue reproduced".
    - Exit with code 2.
  Do NOT classify focal-symbol errors as "Other issues".

  Example of the print-and-exit convention:

  ```python
  import sys
  try:
      # ... run snippet ...
      produced = do_something()
      expected = "<expected>"
  except (AttributeError, TypeError, ImportError) as e:
      print(f"focal-error: {type(e).__name__}: {e}")
      print("Issue reproduced"); sys.exit(2)
  except Exception:
      print("Other issues"); sys.exit(1)
  if produced == expected:
      print("Issue resolved"); sys.exit(0)
  else:
      print("Issue reproduced"); sys.exit(2)
  ```

  Constraints:
  - Use only Python standard library plus the repository's own modules.
  - Stay faithful to the reporter's API calls — don't substitute similar-but-different methods.
  {% if symbol_name %}- The test targets the symbol: {{ symbol_name }}{% if import_path %} (imported from {{ import_path }}){% endif %}.{% endif %}

  Test-depth requirement (IMPORTANT for distinguishing real fixes from
  workarounds): if the issue mentions a specific class, method, attribute,
  or property by name, assert on that exact API surface DIRECTLY — not
  only on the user-facing scenario the reporter showed. Workaround
  patches often satisfy the reporter's snippet while leaving the
  named API broken; add a parallel direct-API assertion (e.g. if the
  reporter showed `str(model.field)`, ALSO assert
  `str(EnumClass.MEMBER) == expected_value`).
  {% if test_framework_hint %}

  Framework-specific setup (IMPORTANT — follow this to make the test actually exercise the bug):
  {{ test_framework_hint }}
  {% endif %}

  Wrap the complete test in ```python...```.
